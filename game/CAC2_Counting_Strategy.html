    <style>
      .cac2 { max-width: 900px; margin: 0 auto; padding: 0 16px; line-height: 1.6; }

      .cac2 table { border-collapse: collapse; margin: 0 auto; font-family: Arial, Helvetica, sans-serif; font-weight: bold; }
      .cac2 caption { font-family: Georgia, "Times New Roman", serif; font-weight: bold; padding: 6px; }
      .cac2 th, .cac2 td { border: 1px solid #d0d0d0; text-align: center; }

      /* Tag values */
      .tags th { background: #4caf50; color: black; padding: 10px 14px; min-width: 32px; }
      .tags td { background: #ffff59; padding: 10px 14px; }

      /* Index + basic strategy charts */
      .bj-table th, .bj-table td { width: 40px; height: 24px; padding: 0 2px; font-size: 14px; }
      .bj-table caption { background: #2b2b2b; color: white; font-family: Arial, Helvetica, sans-serif; }
      .bj-table tr.sec th { background: #2f6fbf; color: white; text-transform: uppercase; height: 22px; }

      .c-hit { background: #4caf50; }
      .c-stand { background: #e8392b; }
      .c-dbl { background: #0d1b52; color: white; }
      .c-split { background: #4daae8; }
      .c-das { background: repeating-linear-gradient(45deg, #4daae8 0 6px, #b5dcf6 6px 12px); }
      .c-nosplit { background: #f2f2f2; color: #777; }
      .c-sur { background: #ffff59; }
      .c-blank { background: white; }
      .c-idx { background: #ffff59; color: black; }
      .bs td { font-size: 13px; }

      .legend { display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: center; font-size: 15px; margin: 10px 0; }
      .legend span.sw { display: inline-block; width: 26px; height: 16px; vertical-align: middle; margin-right: 6px; border: 1px solid #999; text-align: center; font: bold 12px Arial, sans-serif; line-height: 16px; }

      /* Rule switcher */
      .rule-switch { text-align: center; margin: 12px 0; }
      .rule-switch button { font: bold 15px Georgia, serif; padding: 6px 18px; border: 1px solid black; background: white; cursor: pointer; }
      .rule-switch button[aria-pressed="true"] { background: black; color: white; }
      body.show-S17 .rule-H17, body.show-H17 .rule-S17 { display: none; }

      /* Risk averse summary */
      .ra-sum th, .ra-sum td { padding: 4px 10px; font-size: 15px; }
      .ra-sum tr.hd th { background: #9ad44a; text-transform: uppercase; }
      .ra-sum tr.hd th.deck { background: #2b2b2b; color: white; }
      .ra-sum th.grp { background: #9ad44a; text-transform: uppercase; }
      .ra-sum th.play { background: #3a5f96; color: white; }
      .ra-sum td { background: #7ffcff; min-width: 40px; }
      .ra-sum tr.fab th { background: #9ad44a; text-transform: uppercase; }

      .fallback-img { max-width: 100%; height: auto; border: 1px solid black; }
      details { margin: 12px 0; }
      summary { cursor: pointer; }

    <script>
      (function () {
        var data = JSON.parse(document.getElementById("locked").textContent);
        var KEY = "cac2-pass";
        function bytes(b) { return Uint8Array.from(atob(b), function (c) { return c.charCodeAt(0); }); }

        function unlock(pw) {
          var enc = new TextEncoder();
          return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
            .then(function (base) {
              return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: bytes(data.s), iterations: data.n, hash: "SHA-256" },
                base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
            })
            .then(function (key) {
              return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(data.i) }, key, bytes(data.c));
            })
            .then(function (plain) {
              if (!data.z) return new TextDecoder().decode(plain);
              var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream(data.z));
              return new Response(stream).text();
            });
        }

        function show(html) {
          document.getElementById("lock").remove();
          document.getElementById("content").innerHTML = html;
          document.querySelectorAll("a[data-pdf]").forEach(function (a) {
            var url = URL.createObjectURL(new Blob([bytes(a.getAttribute("data-pdf"))], { type: "application/pdf" }));
            a.removeAttribute("data-pdf");
            a.href = url;
            a.target = "_blank";
          });
          setupRuleSwitch();
        }

        function setupRuleSwitch() {
          function setRule(rule) {
            document.body.classList.remove("show-S17", "show-H17");
            document.body.classList.add("show-" + rule);
            document.querySelectorAll(".rule-switch button").forEach(function (b) {
              b.setAttribute("aria-pressed", b.getAttribute("data-rule") === rule ? "true" : "false");
            });
          }
          document.querySelectorAll(".rule-switch").forEach(function (s) {
            s.hidden = false;
            s.addEventListener("click", function (e) {
              var rule = e.target.getAttribute && e.target.getAttribute("data-rule");
              if (rule) setRule(rule);
            });
          });
          setRule("S17");
        }

        var saved = null;
        try { saved = sessionStorage.getItem(KEY); } catch (e) {}
        if (saved) unlock(saved).then(show, function () {});

        document.getElementById("lock").addEventListener("submit", function (e) {
          e.preventDefault();
          var pw = document.getElementById("pw").value;
          var err = document.getElementById("err");
          var btn = document.getElementById("unlock");
          btn.disabled = true;
          err.textContent = "Checking...";
          unlock(pw).then(function (html) {
            try { sessionStorage.setItem(KEY, pw); } catch (e) {}
            show(html);
          }, function () {
            err.textContent = "Wrong password.";
            btn.disabled = false;
          });
        });
      })();
    </script>
